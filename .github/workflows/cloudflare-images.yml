name: Upload Cloudflare Images

on:
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'scripts/upload-cloudflare-images.mjs'
      - '.github/workflows/cloudflare-images.yml'
  workflow_dispatch:

jobs:
  upload:
    name: Upload git image backups to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload to Cloudflare Images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGES_ACCOUNT_HASH: ${{ secrets.CLOUDFLARE_IMAGES_ACCOUNT_HASH }}
        run: node scripts/upload-cloudflare-images.mjs
